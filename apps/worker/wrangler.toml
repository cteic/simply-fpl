name = "simplyfpl-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "FPL_CACHE"
id = "478c306b8b974f85bc2a9b83a51d87d1"
preview_id = "51fbb5bf51fb4ff7a2a6ff28bffaac0a"

# Speed-comparison artefact store — see docs/rfcs/003-speed-comparison.md.
# Pete must create the bucket (`wrangler r2 bucket create simplyfpl-vs`) before deploy.
[[r2_buckets]]
binding = "VS_BUCKET"
bucket_name = "simplyfpl-vs"
preview_bucket_name = "simplyfpl-vs-preview"

# Browser Rendering — used by the weekly speed-comparison cron.
# Requires the Browser Rendering product to be enabled on the Cloudflare account.
[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "LIVE_GW"
class_name = "LiveGwDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveGwDO"]

[vars]
FPL_BASE_URL = "https://fantasy.premierleague.com/api"

# Cache TTLs (seconds)
BOOTSTRAP_TTL = "3600"
LIVE_GW_TTL = "60"
ENTRY_TTL = "120"
LEAGUE_TTL = "90"

# Build-time stamped at deploy via `wrangler deploy --var GIT_SHA:$(git rev-parse --short HEAD)`
# Falls back to "unknown" on /status if not set.
GIT_SHA = "unknown"

# Cohort engine cron triggers — see docs/rfcs/004-cohort-engine.md
# DISABLED by default. Uncomment to enable after setting Supabase secrets:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE
[triggers]
crons = [
  "*/10 * * * *",  # live-GW cadence
  "0 */6 * * *",   # idle cadence
  "*/15 * * * *",  # /fpl/prices KV warm — keep bootstrap + slim prices hot
  "0 6 * * 1"      # weekly speed-comparison (Mon 06:00 UTC)
]
