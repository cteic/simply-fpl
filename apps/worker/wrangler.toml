name = "simplyfpl-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "FPL_CACHE"
id = "478c306b8b974f85bc2a9b83a51d87d1"
preview_id = "51fbb5bf51fb4ff7a2a6ff28bffaac0a"

[[durable_objects.bindings]]
name = "LIVE_GW"
class_name = "LiveGwDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveGwDO"]

[vars]
FPL_BASE_URL = "https://fantasy.premierleague.com/api"

# Cache TTLs (seconds)
BOOTSTRAP_TTL = "3600"
LIVE_GW_TTL = "60"
ENTRY_TTL = "120"
LEAGUE_TTL = "90"
