name: E2E Tests

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned: ubuntu-latest rolled to 26.04, which Playwright 1.59.1 cannot
    # install browsers on. Revisit when Playwright is next upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Stops Turbo re-hashing racily clean files on every call. See
      # code-checks.yml for the full reason.
      - name: Refresh the git index
        run: git update-index -q --refresh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm --filter @simplyfpl/web e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:8787
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
