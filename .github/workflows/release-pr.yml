name: Open release PR (dev → main)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.4.0). Leave empty to auto-bump minor from latest tag.'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [ -z "$last" ]; then
              v="v0.1.0"
            else
              maj=$(echo "$last" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1/')
              min=$(echo "$last" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*$/\2/')
              v="v${maj}.$((min + 1)).0"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Sanity check (dev ahead of main)
        run: |
          ahead=$(git rev-list --count origin/main..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "::error::dev is not ahead of main — nothing to release."
            exit 1
          fi
          echo "dev is $ahead commits ahead of main."

      - name: Compose PR body
        run: |
          {
            echo "## Summary"
            echo
            echo "Release **${{ steps.version.outputs.version }}**"
            echo
            git log --first-parent --pretty=format:'- %s' origin/main..origin/dev
            echo
            echo
            echo "## Post-merge actions"
            echo
            echo "- On merge, the **Tag release on main** workflow auto-tags \`${{ steps.version.outputs.version }}\`, publishes a GitHub Release, and merges \`main\` back into \`dev\` (\`chore: sync main into dev\`) so dev stays at-or-ahead of main. Run it from the Actions tab only if you need to re-tag or override the version."
            echo "- Cloudflare Pages + Worker auto-deploy on push to main."
            echo "- Smoke-test https://simplyfpl.com in incognito once the deploy is live."
            echo
            echo "Type: release"
          } > /tmp/pr_body.md

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for dev → main. No-op."
            exit 0
          fi
          gh pr create \
            --base main \
            --head dev \
            --title "release: ${{ steps.version.outputs.version }}" \
            --body-file /tmp/pr_body.md \
            --assignee pete-watters
