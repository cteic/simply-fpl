name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    # Always runs so the deploy jobs (which depend on it) aren't skipped on PRs,
    # but only applies migrations on a push to main. Pending migrations under
    # supabase/migrations/ are pushed to the production database before deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        if: github.event_name == 'push'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  worker:
    if: github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @simplyfpl/worker run deploy

  web:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build web with @cloudflare/next-on-pages
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
        run: pnpm exec next-on-pages
      - name: Create Pages project if needed
        working-directory: apps/web
        run: pnpm exec wrangler pages project create simply-fpl --production-branch main 2>/dev/null || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec wrangler pages deploy .vercel/output/static \
              --project-name=simply-fpl \
              --branch="${{ github.head_ref }}" \
              --commit-dirty=true 2>&1 | tee deploy.log
          else
            pnpm exec wrangler pages deploy .vercel/output/static \
              --project-name=simply-fpl \
              --commit-dirty=true 2>&1 | tee deploy.log
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.simply-fpl\.pages\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployment:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
