name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Manual run, for the one case a PR cannot cover. `wrangler versions upload`
  # refuses to run against a Worker that does not exist, and only a deploy
  # creates one — but a PR always takes the upload path, so a brand-new Worker
  # can never be created from a PR. Dispatching on the branch takes the deploy
  # path and creates it. The API-worker job stays skipped; it requires a push.
  workflow_dispatch:

# PR runs cancel each other. Production runs never cancel: a rollout stopped
# between traffic splits would leave production on two versions. They share a
# group with rollback-web.yml so a rollout and a rollback never overlap.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production-web' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrate:
    # Always runs so the deploy jobs (which depend on it) aren't skipped on PRs,
    # but only applies migrations on a push to main. Pending migrations under
    # supabase/migrations/ are pushed to the production database before deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        if: github.event_name == 'push'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  worker:
    if: github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @simplyfpl/worker run deploy

  web:
    needs: migrate
    runs-on: ubuntu-latest
    # A production push adds a staged rollout (dark soak, optional canary
    # watch) after the build. See docs/deploy-rollout.md.
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # Read before the upload: the version serving production now is the one a
      # failed rollout returns to.
      - name: Record stable production version
        id: stable
        if: github.event_name == 'push'
        run: node scripts/rollout/cli.mjs stable
      - name: Deploy (dispatch), upload rollout candidate (push) or preview version (PR)
        id: deploy
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pnpm run deploy 2>&1 | tee deploy.log
          else
            pnpm run upload 2>&1 | tee deploy.log
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]*simply-fpl[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      # Production rollout: dark at 0%, optional canary, promote. Any failed
      # check sends traffic back to the stable version and fails this job.
      - name: Find rollout candidate version
        id: candidate
        if: github.event_name == 'push'
        run: node scripts/rollout/cli.mjs parse-upload apps/web/deploy.log
      - name: Roll out to production
        id: rollout
        if: github.event_name == 'push'
        env:
          ROLLOUT_CANARY_PERCENT: ${{ vars.ROLLOUT_CANARY_PERCENT }}
          ROLLOUT_WATCH_SECONDS: ${{ vars.ROLLOUT_WATCH_SECONDS }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CANDIDATE: ${{ steps.candidate.outputs.version_id }}
          STABLE: ${{ steps.stable.outputs.version_id }}
        run: node scripts/rollout/cli.mjs release --candidate "$CANDIDATE" --stable "$STABLE"
      # `versions upload` does not apply route changes in wrangler.jsonc; this
      # does, once the new version is serving all traffic.
      - name: Apply routes
        if: github.event_name == 'push'
        working-directory: apps/web
        run: pnpm exec wrangler triggers deploy
      # Exercises the same smoke suite the rollout uses, against this PR's
      # preview version. Changes nothing in production.
      - name: Smoke check preview version
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/rollout/cli.mjs smoke --url "$PREVIEW_URL"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployment:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Page speed budget for the preview the web job just uploaded.
  lighthouse:
    if: github.event_name == 'pull_request' && needs.web.outputs.url != ''
    needs: web
    permissions:
      contents: read
      pull-requests: write
    uses: cteic/foundry/.github/workflows/lighthouse.yml@2d77a5b026b821c0566d0443c8d2e314986111d1
    with:
      url: ${{ needs.web.outputs.url }}
      paths: / /h2h
      config: apps/web/lighthouserc.json
      node-version: '22'
