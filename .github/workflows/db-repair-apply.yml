name: DB repair and apply

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show profiles policies (verify 0006)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y -q postgresql-client > /dev/null
          psql "$SUPABASE_DB_URL" -c "select polname, polcmd from pg_policy p join pg_class c on c.oid=p.polrelid where c.relname='profiles'"
          psql "$SUPABASE_DB_URL" -tAc "select count(*) from information_schema.triggers where event_object_table='profiles'"
      - name: Revert phantom baseline entries for 0004 and 0005
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration repair --status reverted 0004 0005 --db-url "$SUPABASE_DB_URL"
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL" --yes
      - name: Confirm final state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -tAc "select table_name from information_schema.tables where table_schema='public' order by 1"
