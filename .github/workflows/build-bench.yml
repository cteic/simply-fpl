name: Build Bench

# Thin caller for foundry's reusable build-bench workflow. It runs this repo's
# own scripts/bench-build.sh on both sides of the comparison, so the cold and
# cached cases, the Turborepo cache handling and the git-index refresh all stay
# here rather than moving into shared defaults.
#
# This is a report, not a budget: times on shared runners vary too much to fail
# a PR on.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build-bench:
    permissions:
      contents: read
      pull-requests: write
    uses: cteic/foundry/.github/workflows/build-bench.yml@2d77a5b026b821c0566d0443c8d2e314986111d1
    with:
      bench-script: scripts/bench-build.sh
      runs: 3
      node-version: '22'
