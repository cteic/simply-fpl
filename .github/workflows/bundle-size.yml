name: Bundle Size

# Thin caller for foundry's reusable bundle-size workflow. The budgets stay in
# scripts/check-bundle-budget.mjs; the shared workflow builds the branch, runs
# that script, compares with the base commit and comments the table.
#
# The pin is a commit on cteic/foundry main, never a branch: a reusable
# workflow runs repo code, so the version has to be fixed.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  bundle-size:
    permissions:
      contents: read
      pull-requests: write
    uses: cteic/foundry/.github/workflows/bundle-size.yml@2d77a5b026b821c0566d0443c8d2e314986111d1
    with:
      build-dir: apps/web/.next
      # check-bundle-budget.mjs names the flag --next-dir, not --build-dir.
      build-dir-flag: --next-dir
      build-command: pnpm build:packages && pnpm build:web
      node-version: '22'
