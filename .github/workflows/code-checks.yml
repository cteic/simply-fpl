name: Code Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Commitlint diffs base..head; needs full history, not a shallow clone.
          fetch-depth: 0
      # PR size (advisory): @cteic/pr-size from cteic/foundry. Non-blocking by
      # design. A blocking size check gets bypassed; the value is the split
      # conversation on the PR. dry-run keeps the report and drops the exit
      # code. The action brings its own Node 24, which this repo is not on.
      - name: PR size (advisory)
        if: github.event_name == 'pull_request'
        uses: cteic/foundry/packages/pr-size@2d77a5b026b821c0566d0443c8d2e314986111d1
        with:
          max-lines: '500'
          max-files: '10'
          dry-run: 'true'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workflow timeouts
        run: node scripts/check-workflow-timeouts.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - name: PostHog PII check
        run: pnpm check:pii
      - name: Supabase RLS check
        run: pnpm check:rls
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rollout script tests
        run: node --test scripts/rollout/*.test.mjs
      - run: pnpm build:packages
      - run: pnpm build:web
      - name: Bundle size budget
        run: node scripts/check-bundle-budget.mjs

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
