name: Code Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Commitlint diffs base..head; needs full history, not a shallow clone.
          fetch-depth: 0
      # A fresh checkout leaves tracked files "racily clean": same mtime as the
      # git index, so git re-reads them on every `git status`. Turbo runs it
      # with GIT_OPTIONAL_LOCKS=0, which never saves the refreshed index, so
      # every Turbo call pays 1-3.6 s here. One refresh removes the cost. It
      # stages nothing and exits 0 on a dirty tree.
      - name: Refresh the git index
        run: git update-index -q --refresh
      # PR size (advisory): the dotfiles size checker, brought into the
      # repo so it has a call site. Non-blocking by design — a blocking size
      # check gets bypassed; the value is the split conversation on the PR.
      - name: PR size (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE:refs/remotes/origin/$BASE" || true
          bash scripts/pr-size-check.sh || true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workflow timeouts
        run: node scripts/check-workflow-timeouts.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - name: PostHog PII check
        run: pnpm check:pii
      - name: Supabase RLS check
        run: pnpm check:rls
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rollout script tests
        run: node --test scripts/rollout/*.test.mjs
      - run: pnpm build:packages
      - run: pnpm build:web
      - name: Bundle size budget
        run: node scripts/check-bundle-budget.mjs

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
