name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Prod routes render guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787
      - run: pnpm --filter @simplyfpl/web exec playwright install chromium --with-deps
      - name: Generate BDD specs from .feature files
        run: pnpm --filter @simplyfpl/web exec bddgen --config playwright.config.ts
      - name: Run visual regression (prod routes render guardrail)
        run: pnpm --filter @simplyfpl/web exec playwright test --config playwright.config.ts --grep "Prod routes render guardrail"
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:8787
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-visual-regression
          path: apps/web/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-test-results-visual-regression
          path: apps/web/test-results
          retention-days: 7
